<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Коч Румс</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, Arial, sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
  #sub { position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%); max-width: 80%; text-align: center;
    font-size: clamp(16px, 2.3vw, 28px); line-height: 1.3; padding: 6px 14px; background: rgba(0,0,0,.5); border-radius: 6px;
    text-shadow: 0 0 4px #000; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #sub.on { opacity: 1; }
  #overlay button { font: inherit; font-size: clamp(14px, 2vw, 22px); padding: 10px 18px; margin: 6px; border-radius: 8px; border: 1px solid #ffe9a0; background: rgba(0,0,0,.55); color: #ffe9a0; cursor: pointer; }
  #overlay button:hover { background: rgba(255,233,160,.2); }
  #overlay input { font: inherit; font-size: clamp(14px, 2vw, 22px); width: 6ch; padding: 10px; margin: 6px; border-radius: 8px; border: 1px solid #ffe9a0; background: rgba(0,0,0,.55); color: #fff; text-transform: uppercase; text-align: center; letter-spacing: 3px; }
  #overlay .lobby { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 10px; }
  #overlay .code { font-size: clamp(40px, 9vw, 110px); letter-spacing: 12px; color: #9fffb0; }
  #chatlog { position: fixed; right: 16px; top: 14px; padding: 4px 12px; background: rgba(0,0,0,.5); border-radius: 6px; font-size: clamp(14px, 1.8vw, 22px); color: #bfffee; display: none; pointer-events: none; }
  #items { position: fixed; left: 16px; top: 14px; padding: 4px 12px; background: rgba(0,0,0,.5); border-radius: 6px; font-size: clamp(14px, 1.8vw, 22px); color: #ffe9a0; display: none; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 20%; transform: translateX(-50%); font-size: clamp(14px, 1.8vw, 22px);
    padding: 4px 12px; background: rgba(0,0,0,.55); border: 1px solid #fff6; border-radius: 6px; opacity: 0; pointer-events: none; }
  #hint.on { opacity: 1; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #fff8; pointer-events: none; }
  #stam { position: fixed; left: 16px; bottom: 16px; width: 140px; height: 8px; background: #0008; border: 1px solid #fff5; display: none; }
  #stam i { display: block; height: 100%; width: 100%; background: #e8d36a; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #vig { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(ellipse 60% 14% at 50% 50%, transparent 0, rgba(0,0,0,.96) 100%); }
  #vig.on { opacity: 1; }
  #msg { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: clamp(28px, 6vw, 72px); font-weight: 800;
    color: #e33; text-shadow: 0 0 12px #000; opacity: 0; pointer-events: none; transition: opacity .3s; text-align: center; }
  #msg.on { opacity: 1; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,.86); text-align: center; cursor: pointer; padding: 20px; box-sizing: border-box; }
  #overlay h1 { font-size: clamp(36px, 8vw, 96px); margin: 0; letter-spacing: 4px; color: #e8d36a; text-shadow: 0 0 18px #a80; }
  #overlay p { margin: 0; font-size: clamp(14px, 2vw, 22px); max-width: 640px; opacity: .85; }
  #overlay b { font-size: clamp(18px, 2.6vw, 30px); margin-top: 10px; }
  #overlay.hide { display: none; }
  #overlay { z-index: 20; }
  #touch { display: none; position: fixed; inset: 0; z-index: 5; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.touch:not(.ovl) #touch { display: block; }
  body.touch { touch-action: none; -webkit-user-select: none; user-select: none; }
  #look { position: absolute; right: 0; top: 0; width: 55%; height: 100%; touch-action: none; }
  #joy { position: absolute; left: 0; top: 0; width: 45%; height: 100%; touch-action: none; }
  #joyb { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 120px; height: 120px; margin: 0;
    border-radius: 50%; border: 2px solid #fff6; background: #ffffff14; pointer-events: none; }
  #joyk { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: #ffffff55; border: 2px solid #fff9; transform: translate(-50%, -50%); }
  .tb { position: absolute; border-radius: 50%; border: 2px solid #ffe9a0; background: rgba(0,0,0,.45); color: #ffe9a0; font: 700 22px system-ui, Arial, sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent; padding: 0; }
  .tb:active, .tb.hot { background: rgba(232,211,106,.45); }
  #tE { right: calc(24px + env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom)); width: 84px; height: 84px; font-size: 30px; }
  #tE.hot { box-shadow: 0 0 16px #ffe9a0; }
  #tRun { right: calc(116px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 66px; height: 66px; font-size: 14px; }
  #tchat { position: absolute; left: 50%; bottom: calc(8px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; gap: 8px; }
  #tchat .tb { position: static; border-radius: 10px; width: auto; height: 38px; padding: 0 10px; font-size: 14px; }
  #tpause { position: absolute; left: 50%; top: calc(8px + env(safe-area-inset-top)); transform: translateX(-50%); width: 44px; height: 36px; font-size: 18px; border-radius: 8px; }
  body.touch #stam { left: 50%; bottom: auto; top: calc(52px + env(safe-area-inset-top)); transform: translateX(-50%); }
  body.touch #cross { display: none; }
  #pc { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.65); }
  #pc.on { display: flex; }
  #pc .scr { position: relative; width: min(920px, 96vw); height: min(600px, 88vh); background: linear-gradient(#1d6fa5, #3fa0d8); border: 10px solid #222; border-radius: 10px; overflow: hidden; font: 15px Tahoma, Arial, sans-serif; color: #111; box-sizing: border-box; }
  #pc .scr.glitch { animation: glitch .18s infinite; }
  @keyframes glitch { 0% { filter: none; transform: none; } 50% { filter: hue-rotate(120deg) contrast(1.6); transform: translate(3px, -2px); } 100% { filter: invert(.15); transform: translate(-2px, 1px); } }
  #pc .ic { width: 84px; margin: 12px 8px; text-align: center; color: #fff; cursor: pointer; text-shadow: 0 1px 2px #000; font-size: 13px; }
  #pc .ic i { display: block; font-style: normal; font-size: 34px; }
  #pc .badge { background: #e33; color: #fff; border-radius: 8px; padding: 0 5px; }
  #pc .win { position: absolute; left: 104px; top: 14px; right: 14px; bottom: 54px; background: #ece9d8; border: 2px solid #0a246a; display: flex; flex-direction: column; }
  #pc .tt { display: flex; justify-content: space-between; background: linear-gradient(90deg, #0a246a, #3a6ea5); color: #fff; font-weight: 700; padding: 4px 8px; }
  #pc .bd { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  #pc .msg { max-width: 75%; padding: 6px 10px; border-radius: 8px; background: #fff; }
  #pc .msg.me { margin-left: auto; background: #c8f0c8; }
  #pc .msg u { display: block; text-decoration: none; font-size: 12px; color: #0a246a; font-weight: 700; }
  #pc .dim { color: #555; margin: 4px 0; }
  #pc .hit { background: #fff; border-left: 3px solid #3a6ea5; padding: 6px 10px; }
  #pc .sbox { background: #fff; border: 1px solid #888; padding: 6px 10px; margin: 6px 0; color: #777; }
  #pc button { font: inherit; cursor: pointer; padding: 6px 10px; margin: 3px; border: 1px solid #777; border-radius: 4px; background: #f4f3ee; color: #111; text-align: left; }
  #pc canvas { max-width: 100%; border: 1px solid #000; cursor: crosshair; align-self: center; }
  #pc .inside { color: #c00; font-size: clamp(18px, 3vw, 34px); line-height: 1.2; margin: 0; }
  #pc .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 8px; background: #245edb; color: #fff; }
  #pc .bar .start { background: #3c9a3c; color: #fff; font-weight: 700; border: 0; border-radius: 0 12px 12px 0; }
  #pc .bar .up { margin-left: auto; }
</style>
</head>
<body>
<div id="vig"></div>
<div id="cross"></div>
<div id="hint"></div>
<div id="sub"></div>
<div id="stam"><i></i></div>
<div id="items"></div>
<div id="chatlog"></div>
<div id="msg"></div>
<div id="fade"></div>
<div id="touch">
  <div id="look"></div>
  <div id="joy"><div id="joyb"><i id="joyk"></i></div></div>
  <button class="tb" id="tE" data-code="KeyE">E</button>
  <button class="tb" id="tRun" data-code="ShiftLeft">БЕГ</button>
  <div id="tchat">
    <button class="tb" data-code="Digit1">Сюда!</button><button class="tb" data-code="Digit2">Берегись!</button><button class="tb" data-code="Digit3">Нашёл!</button><button class="tb" data-code="Digit4">Помоги!</button>
  </div>
  <button class="tb" id="tpause">⏸</button>
</div>
<div id="pc"></div>
<div id="overlay"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="logic.js?v=dlc3"></script>
<script src="net.js?v=dlc3"></script>
<script type="module">
import * as THREE from 'three';

const L = window.KochLogic;
const S = 2.5;                       // world units per grid cell
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

// =====================================================================
// Renderer / camera / input
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';
const scene = new THREE.Scene();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

const keys = {};
const pressed = new Set();
addEventListener('keydown', (e) => {
  if (!keys[e.code]) pressed.add(e.code);
  keys[e.code] = true;
  if (e.code === 'KeyP' && started && !ended && !pcOpen && !e.repeat && document.activeElement.tagName !== 'INPUT') {
    if (paused) resume(); else { clearKeys(); document.exitPointerLock && document.exitPointerLock(); setPaused(true); }
  }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
const clearKeys = () => { for (const k in keys) keys[k] = false; pressed.clear(); };
addEventListener('blur', clearKeys);
document.addEventListener('visibilitychange', () => { if (document.hidden && started && !ended && !paused) { clearKeys(); setPaused(true); } });

const player = { x: 1.5, y: 1.5, yaw: 0, pitch: 0, eye: 1.6, hidden: false, frozen: false, stamina: 1, tired: false, sprint: false, bob: 0, stepDist: 0 };
let locked = false, paused = true, started = false, ended = false;
const net = {
  role: 'solo', link: null, code: '', connected: false, busy: false, gen: 0, snap: null, snapAt: 0, posAt: 0,
  remote: { interp: null, pos: null, hidden: false },
  send(m) { if (net.link) net.link.send(m); },
};

// ---------- touch controls ----------
const TOUCH = params.get('touch') === '1' || (matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0);
const joy = { f: 0, r: 0 };
if (TOUCH) { document.body.classList.add('touch'); initTouch(); }
function initTouch() {
  const zone = $('joy'), base = $('joyb'), knob = $('joyk'), R = 55;
  let jid = null, cx = 0, cy = 0;
  const jmove = (e) => {
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
    dx *= k; dy *= k;
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    const m = Math.hypot(dx, dy) / R;
    if (m < 0.25) { joy.f = 0; joy.r = 0; } else { joy.r = dx / R; joy.f = -dy / R; }
  };
  const jend = (e) => {
    if (e.pointerId !== jid) return;
    jid = null; joy.f = 0; joy.r = 0; knob.style.transform = 'translate(-50%, -50%)';
    base.style.left = ''; base.style.top = ''; base.style.bottom = '';
  };
  zone.addEventListener('pointerdown', (e) => {
    if (jid !== null) return;
    e.preventDefault(); jid = e.pointerId; zone.setPointerCapture(e.pointerId);
    cx = e.clientX; cy = e.clientY;                                   // floating stick: origin where the thumb lands
    base.style.left = (cx - 60) + 'px'; base.style.top = (cy - 60) + 'px'; base.style.bottom = 'auto';
    jmove(e);
  });
  zone.addEventListener('pointermove', (e) => { if (e.pointerId === jid) jmove(e); });
  zone.addEventListener('pointerup', jend); zone.addEventListener('pointercancel', jend);

  const look = $('look'); let lid = null, lx = 0, ly = 0;
  look.addEventListener('pointerdown', (e) => { if (lid !== null) return; e.preventDefault(); lid = e.pointerId; look.setPointerCapture(e.pointerId); lx = e.clientX; ly = e.clientY; });
  look.addEventListener('pointermove', (e) => {
    if (e.pointerId !== lid) return;
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    if (paused) return;
    player.yaw -= dx * 0.006;
    player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - dy * 0.006));
  });
  const lend = (e) => { if (e.pointerId === lid) lid = null; };
  look.addEventListener('pointerup', lend); look.addEventListener('pointercancel', lend);

  for (const b of document.querySelectorAll('#touch .tb[data-code], #touch .tb[data-hold]')) {
    const code = b.dataset.code, hold = b.dataset.hold;
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault(); b.setPointerCapture(e.pointerId);
      if (hold) keys[hold] = true; else { if (!keys[code]) pressed.add(code); }
      if (navigator.vibrate) try { navigator.vibrate(12); } catch (er) { /* optional */ }
    });
    const up = () => { if (hold) keys[hold] = false; };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  }
  $('tpause').addEventListener('pointerdown', (e) => { e.preventDefault(); if (started && !ended && !paused) setPaused(true); });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
}

function requestLock() {
  try { const p = renderer.domElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* no lock: keyboard look */ }
}
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (!locked && started && !ended && !pcOpen) { clearKeys(); setPaused(true); }
});
document.addEventListener('mousemove', (e) => {
  if (!locked || paused) return;
  player.yaw -= e.movementX * 0.0022;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - e.movementY * 0.0022));
});
renderer.domElement.addEventListener('click', () => { if (!locked && started && !ended && !pcOpen) { requestLock(); setPaused(false); } });

// =====================================================================
// HUD, subtitles, game-time waits
// =====================================================================
let subT = 0;
const waits = [];
function wait(sec) { return new Promise((r) => waits.push({ t: sec, r })); }
function tickWaits(dt) {
  for (let i = waits.length - 1; i >= 0; i--) {
    waits[i].t -= dt;
    if (waits[i].t <= 0) { const w = waits.splice(i, 1)[0]; w.r(); }
  }
}
function say(text, sec = 3, own = false) {
  if (net.role === 'guest' && !own) return wait(sec);       // guest shows only the host's mirrored lines
  if (net.role === 'host') net.send({ type: 'say', text: String(text).slice(0, 120), sec });
  const el = $('sub');
  el.textContent = text; el.classList.add('on');
  subT = sec;
  return wait(sec);
}
function tickSub(dt) { if (subT > 0) { subT -= dt; if (subT <= 0) $('sub').classList.remove('on'); } }
function setHint(t) {
  const h = $('hint');
  if (t) { h.textContent = TOUCH ? t.replace(/^E — /, 'Кнопка E — ') : t; h.classList.add('on'); } else h.classList.remove('on');
  if (TOUCH) $('tE').classList.toggle('hot', !!t);
}
let msgTimer = 0;
function bigMsg(t, ms = 1800) { const m = $('msg'); m.textContent = t; m.classList.add('on'); clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove('on'), ms); }
function fade(op, color = '#000') { const f = $('fade'); f.style.background = color; f.style.opacity = op; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let overlayAt = 0;
function showOverlay(html, onClick) {
  const o = $('overlay');
  o.innerHTML = TOUCH ? html.replace(/Кликни/g, 'Тапни') : html; o.classList.remove('hide');
  document.body.classList.add('ovl');
  overlayAt = performance.now();
  // a touch that opened the overlay would otherwise fire its synthesized click on the overlay at once
  o.onclick = onClick ? (e) => { if (performance.now() - overlayAt > 400) onClick(e); } : null;
}
function hideOverlay() { $('overlay').classList.add('hide'); document.body.classList.remove('ovl'); }
function resume() { audio.start(); if (!pcOpen) requestLock(); hideOverlay(); setPaused(false); }
function setPaused(p) {
  paused = p;
  if (p && started && !ended) {
    audio.pause();
    showOverlay('<h1>ПАУЗА</h1><p>Кликни, чтобы продолжить</p><p>P — пауза / продолжить</p>', resume);
  }
}

// =====================================================================
// Procedural audio
// =====================================================================
const audio = (() => {
  let ctx = null, master, lp, noiseBuf, humGain, droneGain, exitGain;
  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.8;
      lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 20000;
      master.connect(lp); lp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      humGain = ctx.createGain(); humGain.gain.value = 0; humGain.connect(master);
      [50, 100, 150, 200].forEach((f, i) => {
        const o = ctx.createOscillator(); o.frequency.value = f; o.type = 'sine';
        const g = ctx.createGain(); g.gain.value = 0.03 / (i + 1);
        o.connect(g); g.connect(humGain); o.start();
      });
      droneGain = ctx.createGain(); droneGain.gain.value = 0; droneGain.connect(master);
      const df = ctx.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 220; df.connect(droneGain);
      [55, 55.8, 82.4].forEach((f) => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(df); o.start(); });
      exitGain = ctx.createGain(); exitGain.gain.value = 0; exitGain.connect(master);
      const eo = ctx.createOscillator(); eo.type = 'sine'; eo.frequency.value = 880; eo.connect(exitGain); eo.start();
    } catch (e) { ctx = null; return false; }
    return true;
  }
  const safe = (fn) => (...a) => { try { if (ensure()) return fn(...a); } catch (e) { /* audio is optional */ } };
  function env(g, t0, peak, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function noise(dur, freq, type, peak) {
    const t0 = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); env(g, t0, peak, dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t0); src.stop(t0 + dur + 0.05);
  }
  function osc(type, f0, f1, dur, peak) {
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    const g = ctx.createGain(); env(g, t0, peak, dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    start: safe(() => { if (ctx.state === 'suspended') ctx.resume(); }),
    pause() { try { if (ctx && ctx.state === 'running') ctx.suspend(); } catch (e) { /* audio is optional */ } },
    hum: safe((on) => { humGain.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.3); droneGain.gain.setTargetAtTime(on ? 0.05 : 0, ctx.currentTime, 0.5); }),
    danger: safe((v) => droneGain.gain.setTargetAtTime(0.05 + 0.14 * v, ctx.currentTime, 0.2)),
    exitProx: safe((v) => exitGain.gain.setTargetAtTime(0.025 * v, ctx.currentTime, 0.2)),
    step: safe(() => noise(0.07, 260, 'bandpass', 0.12)),
    sting: safe(() => { osc('sawtooth', 220, 200, 0.7, 0.18); osc('sawtooth', 233, 210, 0.7, 0.18); noise(0.3, 1500, 'highpass', 0.1); }),
    caught: safe(() => { osc('sawtooth', 1000, 80, 0.7, 0.3); noise(0.6, 800, 'lowpass', 0.3); }),
    thud: safe(() => { osc('sine', 90, 25, 0.5, 0.9); noise(0.3, 300, 'lowpass', 0.5); }),
    shot: safe(() => { noise(0.14, 2800, 'lowpass', 0.5); osc('square', 180, 50, 0.1, 0.2); }),
    bell: safe(() => { for (let i = 0; i < 5; i++) setTimeout(() => { try { osc('sine', 1250, 1200, 0.12, 0.25); } catch (e) {} }, i * 180); }),

// Level builder (shared by every scene)
// =====================================================================
function mk(w, h, marks = []) {
  const rows = [];
  for (let y = 0; y < h; y++) {
    let r = '';
    for (let x = 0; x < w; x++) r += (x === 0 || y === 0 || x === w - 1 || y === h - 1) ? '#' : '.';
    rows.push(r.split(''));
  }
  for (const [ch, x, y] of marks) rows[y][x] = ch;
  return rows.map((r) => r.join(''));
}
function parseRows(rows) {
  const cells = [], marks = {};
  rows.forEach((row, y) => {
    if (row.length !== rows[0].length) throw new Error('bad row length at ' + y);
    cells.push([...row].map((ch, x) => {
      if (ch !== '#' && ch !== '.') (marks[ch] = marks[ch] || []).push({ x, y });
      return ch === '#' ? 0 : 1;
    }));
  });
  return { cells, marks };
}

function buildShell(cells, def) {
  const group = new THREE.Group();
  const h = cells.length, w = cells[0].length, H = def.H ?? 3.2;
  const near = (x, y) => {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (cells[y + dy] && cells[y + dy][x + dx] === 1) return true;
    return false;
  };
  const spots = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (cells[y][x] === 0 && near(x, y)) spots.push([x, y]);
  const inst = new THREE.InstancedMesh(BOX(S, H, S), new THREE.MeshLambertMaterial({ map: def.wall() }), spots.length);
  const m4 = new THREE.Matrix4();
  spots.forEach(([x, y], i) => { m4.makeTranslation((x + 0.5) * S, H / 2, (y + 0.5) * S); inst.setMatrixAt(i, m4); });
  group.add(inst);

  const floor = add(group, new THREE.PlaneGeometry(w * S, h * S), new THREE.MeshLambertMaterial({ map: def.floor(w, h) }), w * S / 2, 0, h * S / 2);
  floor.rotation.x = -Math.PI / 2;
  if (def.ceil) {
    const c = add(group, new THREE.PlaneGeometry(w * S, h * S), new THREE.MeshLambertMaterial({ map: def.ceil(w, h) }), w * S / 2, H, h * S / 2);
    c.rotation.x = Math.PI / 2;
  }
  let lampMat = null;
  if (def.lamps) {
    lampMat = new THREE.MeshBasicMaterial({ color: def.lampColor ?? 0xfff2b0, side: THREE.DoubleSide });
    const pts = [];
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) if (cells[y][x] === 1 && def.lampAt(x, y)) pts.push([x, y]);
    const li = new THREE.InstancedMesh(new THREE.PlaneGeometry(S * 0.6, S * 0.6), lampMat, pts.length);
    pts.forEach(([x, y], i) => { m4.makeRotationX(Math.PI / 2); m4.setPosition((x + 0.5) * S, H - 0.02, (y + 0.5) * S); li.setMatrixAt(i, m4); });
    group.add(li);
  }
  return { group, lampMat };
}

function clearScene() {

function setupLevel(def) {
  clearScene();

function buildFall() {
  clearScene();
  scene.background = new THREE.Color(0x05050a);
  scene.fog = new THREE.FogExp2(0x05050a, 0.018);
  scene.add(new THREE.AmbientLight(0xffffff, 2.2));
  const g = new THREE.Group(); scene.add(g);
  const colors = [0x28e0ff, 0xff3ca0, 0xe8d36a, 0x7a5cff];
  for (let i = 0; i < 40; i++) {
    const ring = add(g, new THREE.TorusGeometry(9, 0.18, 6, 32), glow(colors[i % 4]), 0, -10 - i * 8, 0);
    ring.rotation.x = Math.PI / 2;
  }
  const junk = [];
  const makers = [
    () => { const o = new THREE.Group(); add(o, BOX(0.8, 0.5, 0.9), 0xf4f4f4, 0, 0, 0); add(o, new THREE.CylinderGeometry(0.3, 0.25, 0.4, 10), 0xffffff, 0, 0.4, 0); return o; },
    () => { const o = new THREE.Group(); add(o, BOX(1.2, 0.08, 0.7), 0x8a5a2b, 0, 0.7, 0); add(o, BOX(0.08, 0.7, 0.08), 0x5a3b2a, -0.5, 0.35, 0); return o; },
    () => { const o = new THREE.Group(); add(o, BOX(0.9, 0.7, 0.4), 0x222222, 0, 0, 0); add(o, BOX(0.8, 0.6, 0.02), new THREE.MeshBasicMaterial({ map: ctex(128, 96, drawCS) }), 0, 0, 0.21); return o; },
    () => FIG.koch(),
    () => FIG.teacher(),
    () => FIG.standofer(),
    () => { const o = new THREE.Group(); add(o, BOX(0.6, 0.06, 0.8), 0xb0202a, 0, 0, 0); return o; },
  ];
  for (let i = 0; i < 70; i++) {
    const o = makers[i % makers.length]();
    const a = Math.random() * Math.PI * 2, r = 2.5 + Math.random() * 5;
    o.position.set(Math.cos(a) * r, -12 - Math.random() * 280, Math.sin(a) * r);
    o.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    o.userData.spin = [Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5];
    g.add(o); junk.push(o);
  }
  const ground = add(scene, new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ map: T.carpet(40, 40) }), 0, -290, 0);
  ground.rotation.x = -Math.PI / 2;
  const DUR = 12;
  let t = 0, fin = false;
  const subs = [[0.3, 'ААААААААА!!!', 2.5], [3, 'Это точно не канализация…', 2.8], [6, 'Мама, я хочу домой!', 2.8], [9, 'Почему пахнет мокрым ковром?..', 2.5], [11, 'СЕЙЧАС РАЗОБЬЁМСЯ!!!', 1.2]];
  let si = 0;
  player.frozen = true; $('vig').classList.remove('on');
  return {
    freeCamera: true, cells: null, interactables: [],
    begin(my) {
      audio.hum(false); audio.fall(DUR); audio.lowpass(true);
    },
    update(dt) {
      t += dt;
      const y = 6 * t + 1.5 * t * t;
      camera.position.set(Math.sin(t * 0.9) * 0.8, -y, Math.cos(t * 0.7) * 0.8);
      camera.rotation.set(-1.15 + Math.sin(t) * 0.15, t * 0.7, Math.sin(t * 0.8) * 0.4);
      camera.fov = 70 + t * 3.2; camera.updateProjectionMatrix();
      for (const o of junk) { o.rotation.x += o.userData.spin[0] * dt; o.rotation.y += o.userData.spin[1] * dt; o.rotation.z += o.userData.spin[2] * dt; }
      if (t > 8) scene.fog.color.lerp(new THREE.Color(0x2b2610), dt * 0.5);
      while (si < subs.length && t >= subs[si][0]) { say(subs[si][1], subs[si][2]); si++; }
      if (t >= DUR && !fin) {
        fin = true;
        audio.lowpass(false); camera.fov = 75; camera.updateProjectionMatrix();
        audio.thud();
        next({ color: '#ffffff', ms: 250 });
      }
    },
  };
}

  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);

}

let itemsHudText = '';
function setItemsHud(t) { itemsHudText = t; const el = $('items'); el.style.display = t ? 'block' : 'none'; el.textContent = t; }

function buildLevelScene() {
  const level = story.level, cfg = L.LEVELS[level], st = STYLE[level];
  const guest = net.role === 'guest';
  const world = L.generateLevel(level, seed + level * 977);
  const collide = world.cells.map((r) => r.slice());
  const pillarSet = new Set((world.pillars || []).map((p) => `${p.x},${p.y}`));
  const renderCells = pillarSet.size ? world.cells.map((r, y) => r.map((v, x) => (pillarSet.has(`${x},${y}`) ? 1 : v))) : world.cells;
  const lv = setupLevel({ ...st, cells: world.cells, renderCells });
  const amb = scene.children.find((o) => o.isAmbientLight);
  const g = new THREE.Group(); scene.add(g);
  const reserved = new Set([`${world.spawn.x},${world.spawn.y}`, `${world.exit.x},${world.exit.y}`]);
  [...world.hideSpots, ...world.enemySpawns, ...world.items].forEach((p) => reserved.add(`${p.x},${p.y}`));
  const countReach = () => { const d = L.bfs(collide, world.spawn); let n = 0; d.forEach((r) => r.forEach((v) => { if (v >= 0) n++; })); return n; };
  function trySolid(x, y) {
    if (reserved.has(`${x},${y}`) || collide[y][x] !== 1) return false;
    const before = countReach();
    collide[y][x] = 0;
    if (countReach() < before - 1) { collide[y][x] = 1; return false; }
    return true;
  }
  pillarSet.forEach((k) => { const [x, y] = k.split(',').map(Number); collide[y][x] = 0; });
  const inWaterAt = (x, y) => !!(world.water && world.water[Math.floor(y)] && world.water[Math.floor(y)][Math.floor(x)]);

  // ---------- per-level decor ----------
  const pcs = [];
  const shots = ['Хэдшот! Ты убил Коча с AWP.', 'Тебя убила училка с ножа.', 'Terrorists Win!', 'CT win! Все Кочи мертвы.', 'Rush B! Rush B! RUSH B!!!', 'Кто-то кричит «стендофф лучше»…'];
  const faces = [];
  if (world.kind === 'yellow') {
    const room = (n) => world.rooms.find((r) => r.name === n);
    const cr = room('class'), pr = room('pcroom'), kr = room('koch');
    const tint = (r, color) => { const p = add(g, new THREE.PlaneGeometry(5 * S, 5 * S), color, wp(r.x0 + 2), 0.02, wp(r.y0 + 2)); p.rotation.x = -Math.PI / 2; };
    tint(cr, new THREE.MeshLambertMaterial({ map: T.lino(5, 5) }));
    tint(pr, new THREE.MeshLambertMaterial({ map: T.pcCarpet(5, 5) }));
    tint(kr, new THREE.MeshLambertMaterial({ map: T.rug(5, 5) }));
    for (const [dx, dy] of [[1, 1], [3, 1], [1, 3], [3, 3]]) {
      const x = cr.x0 + dx, y = cr.y0 + dy;
      if (trySolid(x, y)) { add(g, BOX(1.3, 0.08, 0.8), 0x8a5a2b, wp(x), 0.75, wp(y)); add(g, BOX(0.08, 0.75, 0.08), 0x5a3b2a, wp(x) - 0.55, 0.37, wp(y)); add(g, BOX(0.08, 0.75, 0.08), 0x5a3b2a, wp(x) + 0.55, 0.37, wp(y)); add(g, BOX(0.5, 0.5, 0.5), 0x4a4a52, wp(x), 0.3, wp(y) + 0.7); }
    }
    if (trySolid(cr.x0 + 2, cr.y0)) {
      add(g, BOX(2.2, 1.3, 0.1), new THREE.MeshBasicMaterial({ map: ctex(256, 128, (c, w, h) => { c.fillStyle = '#1f4a34'; c.fillRect(0, 0, w, h); c.fillStyle = '#eee'; c.font = 'bold 24px Arial'; c.textAlign = 'center'; c.fillText('ТЕМА: КАК ВЫЖИТЬ', w / 2, 50); c.font = '20px Arial'; c.fillText('2 + 2 = ВЫХОД', w / 2, 90); }) }), wp(cr.x0 + 2), 1.4, wp(cr.y0));
    }
    const csTex = ctex(256, 192, drawCS);
    for (const p of world.pcs) {
      const solid = trySolid(p.x, p.y);
      add(g, BOX(1.5, 0.08, 0.9), 0x6a6a72, wp(p.x), 0.72, wp(p.y));
      add(g, BOX(0.08, 0.7, 0.08), 0x444444, wp(p.x) - 0.65, 0.35, wp(p.y));
      add(g, BOX(0.08, 0.7, 0.08), 0x444444, wp(p.x) + 0.65, 0.35, wp(p.y));
      add(g, BOX(0.8, 0.62, 0.45), 0xcfcfc4, wp(p.x), 1.1, wp(p.y) - 0.1);
      const scr = add(g, new THREE.PlaneGeometry(0.66, 0.5), new THREE.MeshBasicMaterial({ map: csTex, color: 0x303030 }), wp(p.x), 1.12, wp(p.y) + 0.126);
      pcs.push({ x: p.x + 0.5, y: p.y + 0.5, scr, on: false, solid });
    }
    if (trySolid(kr.x0 + 3, kr.y0 + 1)) { add(g, BOX(1.5, 0.1, 1.0), 0x7a5a3a, wp(kr.x0 + 3), 0.7, wp(kr.y0 + 1)); add(g, BOX(0.12, 0.7, 0.12), 0x5a3b2a, wp(kr.x0 + 3), 0.35, wp(kr.y0 + 1)); }
    if (trySolid(kr.x0 + 1, kr.y0 + 3)) { add(g, BOX(1.8, 0.8, 1.0), 0x5a3b2a, wp(kr.x0 + 1), 0.4, wp(kr.y0 + 3)); add(g, BOX(1.8, 0.7, 0.25), 0x4a2f20, wp(kr.x0 + 1), 1.0, wp(kr.y0 + 3) - 0.45); }
    if (trySolid(kr.x0 + 1, kr.y0 + 1)) { add(g, BOX(1.2, 0.8, 0.5), 0x222222, wp(kr.x0 + 1), 0.4, wp(kr.y0 + 1)); add(g, BOX(1.0, 0.7, 0.06), glow(0x4a6a8a), wp(kr.x0 + 1), 1.1, wp(kr.y0 + 1)); }
  } else if (world.kind === 'corridors') {
    world.cells.forEach((row, y) => row.forEach((v, x) => {
      if (v !== 1) return;
      for (const [dx, dy] of DIRS) if (world.cells[y + dy] && world.cells[y + dy][x + dx] === 0) faces.push({ x, y, dx, dy });
    }));
  } else if (world.kind === 'pool') {
    const wc = [];
    world.water.forEach((row, y) => row.forEach((v, x) => { if (v) wc.push([x, y]); }));
    const m4 = new THREE.Matrix4();
    const causticTex = T.caustic();
    const wi = new THREE.InstancedMesh(new THREE.PlaneGeometry(S, S), new THREE.MeshLambertMaterial({ map: causticTex, transparent: true, opacity: 0.92 }), wc.length);
    wc.forEach(([x, y], i) => { m4.makeRotationX(-Math.PI / 2); m4.setPosition(wp(x), 0.05, wp(y)); wi.setMatrixAt(i, m4); });
    g.add(wi);
    g.userData.caustic = causticTex;
    for (const p of world.pillars) add(g, new THREE.CylinderGeometry(0.6, 0.6, st.H, 16), new THREE.MeshLambertMaterial({ map: T.poolTile(2, 2) }), wp(p.x), st.H / 2, wp(p.y));
    for (const h of world.rooms) {               // chrome ladder at the pool edge
      const lx = wp(h.x0 + 3), lz = wp(h.y0 + 1) - S * 0.45;
      for (const o of [-0.25, 0.25]) { add(g, new THREE.CylinderGeometry(0.03, 0.03, 1.0, 8), 0xc8ccd0, lx + o, 0.5, lz); }
      add(g, BOX(0.56, 0.04, 0.04), 0xc8ccd0, lx, 1.0, lz);
    }
  }

  // hide spots: yellow lockers / school lockers and plants / changing cabins
  const lockers = world.hideSpots.map((p, i) => {
    if (world.kind === 'yellow') {
      add(g, BOX(1.0, 2.0, 0.9), 0x3a5a48, wp(p.x), 1.0, wp(p.y));
      for (let k = 0; k < 4; k++) add(g, BOX(0.6, 0.03, 0.02), 0x1a2a20, wp(p.x), 1.4 + k * 0.1, wp(p.y) + 0.46);
    } else if (world.kind === 'corridors') {
      if (i % 2) {                                   // potted plant
        add(g, new THREE.CylinderGeometry(0.45, 0.35, 0.7, 12), 0x8a5a3a, wp(p.x), 0.35, wp(p.y));
        for (const [ox, oy, r] of [[-0.3, 0, 0.5], [0.3, 0, 0.5], [0, 0.1, 0.6]]) add(g, new THREE.SphereGeometry(r, 10, 8), 0x2f5a2f, wp(p.x) + ox, 1.15, wp(p.y) + oy);
      } else {                                       // school locker
        add(g, BOX(1.0, 2.0, 0.9), 0x4a6a8a, wp(p.x), 1.0, wp(p.y));
        for (let k = 0; k < 4; k++) add(g, BOX(0.6, 0.03, 0.02), 0x1a2a3a, wp(p.x), 1.4 + k * 0.1, wp(p.y) + 0.46);
      }
    } else {
      add(g, BOX(1.1, 2.4, 1.0), 0xf2f2ea, wp(p.x), 1.2, wp(p.y));
      add(g, BOX(0.8, 1.9, 0.04), 0x4aa8d8, wp(p.x), 1.1, wp(p.y) + 0.52);
    }
    return { x: p.x + 0.5, y: p.y + 0.5 };
  });

  // items
  const progress = L.createProgress(cfg.itemsNeeded);
  const itemMeshes = world.items.map((p) => { const m = makeItemMesh(level); m.position.set(wp(p.x), 0.9, wp(p.y)); g.add(m); return m; });
  const hudText = () => `${cfg.itemName}: ${progress.count()}/${cfg.itemsNeeded}`;
  setItemsHud(hudText());
  function collectItem(id) {
    if (!progress.collect(id)) return false;
    setItemsHud(hudText()); audio.pickup();
    if (progress.ready()) say(`Всё собрано (${cfg.itemsNeeded}/${cfg.itemsNeeded})! Выход открыт — беги к двери!`, 4);
    else say(`Нашёл: ${cfg.itemName} ${progress.count()}/${cfg.itemsNeeded}`, 2.5);
    return true;
  }

  // exit door
  const ex = world.exit;
  const exitG = new THREE.Group(); g.add(exitG);
  const wallDir = DIRS.find(([dx, dy]) => world.cells[ex.y + dy][ex.x + dx] === 0) || [0, -1];
  exitG.position.set(wp(ex.x) + wallDir[0] * S * 0.42, 0, wp(ex.y) + wallDir[1] * S * 0.42);
  exitG.rotation.y = Math.atan2(-wallDir[0], -wallDir[1]);
  add(exitG, BOX(1.5, 2.5, 0.12), 0x1a1a1a, 0, 1.25, 0);
  const doorGlow = new THREE.MeshBasicMaterial({ color: 0x802020 });
  add(exitG, BOX(1.2, 2.2, 0.14), doorGlow, 0, 1.15, 0.01);
  const exitSign = labelSprite('ВЫХОД', '#7dffa6'); exitSign.position.set(0, 2.95, 0.3); exitG.add(exitSign);
  const exitLight = new THREE.PointLight(0xff6060, 14, 12, 2); exitLight.position.set(0, 1.6, 0.8); exitG.add(exitLight);

  const playerLight = new THREE.PointLight(st.light[0], st.light[1], st.light[2], 2); scene.add(playerLight);

  // enemies
  const enemies = [];
  let famIdx = 0;
  function spawnEnemies() {
    enemies.forEach((e) => g.remove(e.mesh));
    enemies.length = 0;
    famIdx = 0;
    for (const sp of world.enemySpawns) {
      const logic = L.makeEnemy(sp);
      const mesh = sp.type === 'kochfam' ? FIG.kochfam(FAMILY[famIdx++ % 4]) : FIG[sp.type]();
      g.add(mesh);
      enemies.push({ logic, mesh, name: sp.type === 'kochfam' ? mesh.userData.name : NAMES[sp.type], px: logic.x, py: logic.y, prev: 'patrol' });
    }
  }
  spawnEnemies();
  const rng = L.makeRng(seed + 7 + level);

  const open = [[1, 0], [0, 1], [-1, 0], [0, -1]].find(([dx, dy]) => world.cells[world.spawn.y + dy][world.spawn.x + dx] === 1) || [1, 0];
  const spawnYaw = Math.atan2(-open[0], -open[1]);
  place(world.spawn.x, world.spawn.y, spawnYaw);
  $('stam').style.display = 'block';
  setItemsHud(hudText());

  let exitFlag = false, shoutCD = 0, lock = false;
  const seen = new Set();
  const noises = [];
  const closedMsg = () => `Выход закрыт: найди ещё ${cfg.itemsNeeded - progress.count()} (${cfg.itemName})`;
  const interactables = [
    ...lockers.map((l) => ({ x: l.x, y: l.y, r: 1.3, label: () => (player.hidden ? 'E — вылезти' : 'E — спрятаться'), use() { toggleHide(l); }, hide: true })),
    ...pcs.map((p) => ({
      x: p.x, y: p.y, r: 1.6, label: () => (p.on ? 'E — стрельнуть' : 'E — включить комп'),
      use() { if (!p.on) { p.on = true; p.scr.material.color.setHex(0xffffff); audio.shot(); } else { audio.shot(); } say(shots[(Math.random() * shots.length) | 0], 3); },
    })),
    ...world.items.map((p, id) => ({ x: p.x + 0.5, y: p.y + 0.5, r: 1.5, label: `E — взять: ${cfg.itemName}`, active: () => !progress.got.has(id), use() { if (guest) net.send({ type: 'act', kind: 'item', id }); else collectItem(id); } })),
    { x: ex.x + 0.5, y: ex.y + 0.5, r: 1.6, label: () => (progress.ready() ? 'E — открыть выход' : closedMsg()),
      use() { if (!progress.ready()) say('Дверь заперта. ' + closedMsg(), 3, true); else if (guest) net.send({ type: 'act', kind: 'exit' }); else exitFlag = true; } },
  ];
  function toggleHide(l) {
    if (player.hidden) { player.hidden = false; player.frozen = false; $('vig').classList.remove('on'); }
    else { player.hidden = true; player.frozen = true; player.x = l.x; player.y = l.y; $('vig').classList.add('on'); }
  }

  async function onCaught(reset = true) {
    lock = true; const my = sid;
    audio.caught(); player.frozen = true; $('vig').classList.remove('on');
    bigMsg('ТЕБЯ ПОЙМАЛИ', 1800); fade(0.85, '#400');
    await sleep(1800); if (!alive(my)) return;
    place(world.spawn.x, world.spawn.y, spawnYaw);
    $('stam').style.display = 'block'; setItemsHud(hudText());
    if (reset && !guest) spawnEnemies();
    player.stamina = 1; player.tired = false;
    fade(0); lock = false; say(guest ? 'Тебя поймали! Враги сбросились, ищи дальше!' : `Попытка ${story.deaths + 1}. Враги сбросились, ищи дальше!`, 3.5, true);
  }

  // events
  let evT = guest ? 1e9 : 45 + Math.random() * 25, dark = 0, shadowT = guest ? 1e9 : 12 + Math.random() * 10;
  let gPrev = null, gStep = 0;
  let shadow = null;
  function windowShadow() {
    const cand = faces.filter((f) => { const d = Math.hypot(f.x + 0.5 - player.x, f.y + 0.5 - player.y); return d > 4 && d < 11; });
    if (!cand.length) return;
    const f = cand[(Math.random() * cand.length) | 0];
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.6), new THREE.MeshBasicMaterial({ map: shadowTex(), fog: false }));
    m.position.set(wp(f.x) + f.dx * (S / 2 - 0.02), 1.9, wp(f.y) + f.dy * (S / 2 - 0.02));
    m.rotation.y = Math.atan2(-f.dx, -f.dy);
    g.add(m);
    shadow = { m, t: 3.5 };
    audio.sting();
    if (Math.random() < 0.5) say('В окне кто-то стоит…', 2.5);
  }

  return {
    cells: collide, interactables, world, progress, level, enemies,
    inWater: inWaterAt,
    netCaught() { onCaught(false); },
    netDark() { dark = 5; audio.sting(); },
    onAct(m) {
      const gq = net.remote.pos;
      if (!gq || lock) return;
      if (m.kind === 'item') { const q = world.items[m.id]; if (q && Math.hypot(gq.x - q.x - 0.5, gq.y - q.y - 0.5) < 2.8) collectItem(m.id); }
      else if (m.kind === 'exit' && progress.ready() && Math.hypot(gq.x - ex.x - 0.5, gq.y - ex.y - 0.5) < 2.8) exitFlag = true;
    },
    noise: (x, y) => { if (cfg.hear) noises.push({ x, y, r: cfg.hear }); },
    begin(my) {
      audio.lowpass(false); audio.hum(st.hum);
      (async () => {
        if (level === 0) {
          await say('Ты упал… Жёлтые обои, гул ламп. Где я?!', 4); if (!alive(my)) return;
          await say(`Выход закрыт. Найди 3 ${cfg.itemName}а. E — взять, E у шкафов — спрятаться, Shift — бежать.`, 6);
        } else {
          bigMsg(cfg.name, 2800);
          await say(level === 1 ? 'Длинные коридоры, окна в ночь… Кто-то стоит за стеклом.' : 'Белая плитка, бассейны. Вода замедляет и плещет — враги услышат.', 4.5); if (!alive(my)) return;
          await say(`Найди 3 ${level === 1 ? 'ключ-карты' : 'вентиля'}, чтобы открыть выход.`, 4.5);
        }
      })();
    },
    update(dt) {
      if (lock) return;
      playerLight.position.set(player.x * S, Math.min(2.2, st.H - 0.5), player.y * S);

      // level events
      if (level === 0) {
        evT -= dt;
        if (evT <= 0 && dark <= 0) { dark = 5; evT = 55 + Math.random() * 35; audio.sting(); say(DARK_TEXT + '!.. Не шуми.', 3); }
        if (dark > 0) dark -= dt;
      } else if (level === 1) {
        shadowT -= dt;
        if (shadowT <= 0 && !shadow) { shadowT = 18 + Math.random() * 14; windowShadow(); }
        if (shadow) { shadow.t -= dt; if (shadow.t <= 0) { g.remove(shadow.m); shadow = null; } }
      } else if (g.userData.caustic) {
        g.userData.caustic.offset.x += dt * 0.03; g.userData.caustic.offset.y += dt * 0.02;
      }
      if (lv.lampMat) {
        const f = dark > 0 ? 0.04 : 0.82 + 0.1 * Math.sin(gameTime * 31) * Math.sin(gameTime * 7) + (level === 0 && Math.sin(gameTime * 1.3) > 0.97 ? -0.4 : 0);
        const c = st.lampRGB;
        lv.lampMat.color.setRGB(c[0] * f, c[1] * f, c[2] * f);
      }
      amb.intensity = dark > 0 ? 0.4 : st.ai;
      const ready = progress.ready();
      doorGlow.color.setHex(ready ? 0xc8ffd8 : 0x802020);
      exitLight.color.setHex(ready ? 0x7dffa6 : 0xff6060);
      exitLight.intensity = 14 + Math.sin(gameTime * 3) * 5;
      itemMeshes.forEach((m, i) => { m.visible = !progress.got.has(i); m.rotation.y += dt * 1.5; m.position.y = 0.9 + Math.sin(gameTime * 2 + i) * 0.08; });

      const pls = [{ x: player.x, y: player.y, hidden: player.hidden }];
      const gp = !guest && net.remote.pos;
      if (gp) {
        pls.push(gp);
        if (cfg.hear && inWaterAt(gp.x, gp.y) && gPrev) {
          gStep += Math.hypot(gp.x - gPrev.x, gp.y - gPrev.y);
          if (gStep > 0.9) { gStep = 0; noises.push({ x: gp.x, y: gp.y, r: cfg.hear }); }
        }
        gPrev = { x: gp.x, y: gp.y };
      } else gPrev = null;
      const opts = { sight: cfg.sight, speedMul: cfg.speedMul, noises };
      let caught = false, guestCaught = false, danger = 0;
      shoutCD -= dt;
      if (guest && net.snap) {
        const had = progress.count();
        progress.fromArray(net.snap.it);
        if (progress.count() !== had) { setItemsHud(hudText()); if (progress.count() > had) audio.pickup(); }
      }
      for (const [i, e] of enemies.entries()) {
        if (guest) {
          const m = net.snap && net.snap.en[i];
          if (m) {
            const far = Math.hypot(m[0] - e.logic.x, m[1] - e.logic.y) > 4, k = far ? 1 : Math.min(1, dt * 12);
            e.logic.x += (m[0] - e.logic.x) * k; e.logic.y += (m[1] - e.logic.y) * k;
            e.logic.state = ['patrol', 'chase', 'search'][m[2]];
          }
        } else L.stepEnemy(collide, e.logic, pls, dt, rng, opts);
        const lg = e.logic;
        e.mesh.position.set(lg.x * S, Math.abs(Math.sin(gameTime * 6 + lg.x)) * 0.03, lg.y * S);
        const vx = lg.x - e.px, vy = lg.y - e.py;
        const moving = Math.hypot(vx, vy) > 1e-4;
        if (moving) {
          const target = Math.atan2(vx, vy);
          let d = target - e.mesh.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
          e.mesh.rotation.y += d * Math.min(1, dt * 8);
        }
        e.px = lg.x; e.py = lg.y;
        animateFigure(e.mesh, gameTime, moving, lg.state === 'chase');
        const red = lg.state === 'chase';
        e.mesh.userData.eyeMats.forEach((m) => m.color.setHex(red ? 0xff1010 : 0x111111));
        if (lg.state === 'chase' && e.prev !== 'chase' && shoutCD <= 0) {
          shoutCD = 3.5; audio.sting();
          const arr = SHOUTS[lg.type]; say(`${e.name}: ${arr[(Math.random() * arr.length) | 0]}`, 2.6);
        }
        e.prev = lg.state;
        const d = Math.hypot(player.x - lg.x, player.y - lg.y);
        if (lg.state === 'chase') danger = Math.max(danger, 1 - Math.min(1, d / 8));
        if (!guest) { const ci = L.isCaughtAny(lg, pls); if (ci === 0) caught = true; else if (ci === 1) guestCaught = true; }
      }
      noises.length = 0;
      audio.danger(danger);
      const dEx = Math.hypot(player.x - ex.x - 0.5, player.y - ex.y - 0.5);
      audio.exitProx(ready ? Math.max(0, 1 - dEx / 14) : 0);

      if (world.kind === 'yellow') {
        const zone = world.zones[Math.floor(player.y)] && world.zones[Math.floor(player.y)][Math.floor(player.x)];
        if (HINTS_ZONE[zone] && !seen.has(zone)) { seen.add(zone); say(HINTS_ZONE[zone], 3.5); }
      }

      if (guest) return;
      if (guestCaught && !caught) {
        net.send({ type: 'caught', who: 'guest' }); story.resolve({ caught: true }); spawnEnemies();
        say('Коча поймали! Враги сбросились.', 3);
      }
      const before = story.level;

function taskSet(list, onTask) {
  const progress = L.createProgress(list.length);
  const guest = net.role === 'guest';
  const run = (id) => { if (!progress.collect(id)) return; audio.pickup(); onTask(id); };
  return {
    progress,
    interactables: list.map((t, id) => ({ x: t.x, y: t.y, r: t.r || 1.5, label: t.label, active: () => !progress.got.has(id),
      use() { if (guest) net.send({ type: 'act', kind: 'task', id }); else run(id); } })),
    onAct(m) { const gq = net.remote.pos, t = list[m.id]; if (m.kind === 'task' && gq && t && Math.hypot(gq.x - t.x, gq.y - t.y) < 2.8) run(m.id); },
    // guest: mirror the host's ticks; returns true when the count changed
    sync() {
      if (!guest || !net.snap) return false;
      const had = progress.count();
      progress.fromArray(net.snap.it.filter((i) => i < list.length));
      if (progress.count() > had) audio.pickup();
      return progress.count() !== had;
    },
  };
}

    if (id === 1) cup.visible = true;

        await say('Мама: Садись, ешь. Бабушке чай налей. И к папе подойди, он что-то хотел.', 4.5);
      })();
    },
    update() {
      if (tasks.sync()) setItemsHud(`Завтрак: ${tasks.progress.count()}/3`);
      bowl.visible = !tasks.progress.got.has(0); cup.visible = tasks.progress.got.has(1); paper.visible = !tasks.progress.got.has(2);
      faceToward(gran, player.x * S, player.y * S);
      faceToward(bro, player.x * S, player.y * S);
      mom.rotation.y = Math.PI + Math.sin(gameTime * 0.7) * 0.4;          // busy at the stove
      dad.rotation.y = -Math.PI / 2;
    },
  };
}

          life.bun = true; audio.pickup(); const my = sid;
          (async () => {
            await say('Продавщица: Тебе как обычно, Коч? С маком?', 3.5); if (!alive(my)) return;
            await say('Ты: Я Коч.', 2); if (!alive(my)) return;
            await say('Продавщица: Ну да, ну да. Коч. Держи, Коч.', 3);
          })();
        } },
      { x: 14.9, y: 6.1, r: 1.5, label: 'E — поздороваться с соседкой',
        use() { say('Соседка: Здравствуй, Кочик! Опять в телефоне со своим другом болтаешь? Ну иди, иди…', 4); } },
      { x: 20.5, y: 6.2, r: 1.4, label: 'E — качнуть качели',
        use() {
          swing = 3; const my = sid;
          (async () => {
            await say('Скрип-скрип. Тут ты в семь лет познакомился с другом.', 3.5); if (!alive(my)) return;
            await say('Ты сказал ему: «Давай я буду тобой, когда тебе страшно». Он кивнул. С тех пор вы вместе.', 5);
          })();
        } },
      { x: 17.5, y: 1.5, r: 1.4, label: 'E — посмотреть на граффити', use() { say('«КОЧ ТОП 1.6». Это ты писал. Ночью. Ты не помнишь, как выходил из дома.', 4); } },
      dogSpot,
      { x: 30.4, y: 4.5, r: 1.5, label: 'E — войти в школу', use() { if (busy) return; busy = true; audio.door(); next(); } },
    ],
    begin(my) {
      audio.hum(false);
      chapter(3, 'Двор');
      (async () => {
        await say('Двор. Ноябрь. Изо рта идёт пар.', 3); if (!alive(my)) return;
        await say('Тебе четырнадцать. Сегодня. И никто не поздравил.', 3.5); if (!alive(my)) return;
        await say('До звонка 70 секунд. Школа — в конце улицы. Лужи обходи!', 4);
      })();
    },
    update(dt) {
      if (!guest && left > 0) {
        left -= dt; hud();
        if (left <= 0) { life.late = true; audio.bell(); say('Вдалеке звенит звонок. Ты опоздал. Училка будет в ярости.', 3.5); }
      }
      if (!wetSaid && this.inWater(player.x, player.y)) { wetSaid = true; life.wet = true; say('Шлёп! Кроссовки насквозь мокрые.', 2.5, true); }
      const t = gameTime * 0.6;
      dog.position.set(wp(24) + Math.cos(t) * 2.2, 0, wp(2) + Math.sin(t * 1.3) * 0.8);
      dog.rotation.y = -t + Math.PI;
      dogSpot.x = dog.position.x / S; dogSpot.y = dog.position.z / S;
      if (swing > 0) swing -= dt;
      seat.rotation.x = Math.sin(gameTime * 2.4) * (swing > 0 ? 0.5 : 0.08);
      faceToward(nb, player.x * S, player.y * S);
      faceToward(lyoha, player.x * S, player.y * S);
      if (!metLyoha && player.x > 25) { metLyoha = true; say('Лёха: Коч! Ты с кем там болтал по дороге? Погнали, звонок!', 3.5); }
    },
  };
}

// ---------- DLC scene: the canteen at the long break, a reaction duel with the Standoff guy ----------
function buildKBreak() {
  const rows = mk(16, 10, []);
  const lv = setupLevel({
    rows, H: 3.4, bg: 0x15140f, ambient: 0xfff4d8, ai: 2.6, fog: [0x15140f, 0.015],
    wall: T.schoolWall, floor: T.schoolFloor, ceil: (w, h) => T.ceiling(w, h), lamps: true, lampAt: (x, y) => x % 4 === 2 && y % 3 === 2,
  });
  const cells = lv.cells.map((r) => r.slice());
  const g = new THREE.Group(); scene.add(g);
  const names = ['Петя', 'Света', 'Гоша', 'Оля', 'Саня', 'Ира'];
  const colors = [0x8a6a3a, 0xd08a2a, 0x4a8ac0, 0xc04a4a, 0x3a9a7a, 0x6a4ac0];
  let ni = 0;
  for (const [x, y] of [[4, 3], [4, 6], [9, 3], [9, 6]]) {
    cells[y][x] = cells[y][x + 1] = 0;
    add(g, BOX(2 * S - 0.4, 0.08, 1.4), 0x8a5a2b, (x + 1) * S, 0.75, wp(y));
    add(g, BOX(0.12, 0.75, 0.12), 0x5a3b2a, (x + 1) * S, 0.37, wp(y));
    if (x === 4 && y === 3) continue;                       // Dasha's table
    for (const dx of [-0.9, 0.9]) {
      const c = FIG.classmate(names[ni % names.length], colors[ni % colors.length]); ni++;
      c.scale.y = 0.78; c.position.set((x + 1) * S + dx, 0, wp(y) + 0.95); c.rotation.y = Math.PI; g.add(c);
    }
  }
  for (let x = 10; x <= 13; x++) cells[1][x] = 0;
  add(g, BOX(4 * S - 0.2, 1.0, S - 0.3), 0xb0b0b8, 12 * S, 0.5, wp(1));
  for (let i = 0; i < 6; i++) add(g, new THREE.CylinderGeometry(0.08, 0.07, 0.16, 10), 0xd08a2a, 10.5 * S + i * 0.9, 1.08, wp(1));
  const cook = npc('Повариха', 0xf4f4f4, 1.75, 0xf4f4f4); cook.position.set(wp(14), 0, wp(1)); g.add(cook);
  const dasha = FIG.classmate('Даша', 0xd04a7a); dasha.position.set(wp(4) + 0.2, 0, wp(2) + 0.3); g.add(dasha);
  const stand = FIG.standofer(); stand.position.set(wp(12), 0, wp(7)); g.add(stand);
  const gang = [FIG.classmate('Шестёрка', 0xe0782a), FIG.classmate('Шестёрка', 0xe0782a)];
  gang[0].position.set(wp(11) + 0.4, 0, wp(8)); gang[1].position.set(wp(13) - 0.4, 0, wp(8)); gang.forEach((m) => g.add(m));
  const door = add(g, new THREE.PlaneGeometry(1.6, 2.4), 0x6b4a2b, 15 * S - 0.03, 1.2, wp(5)); door.rotation.y = -Math.PI / 2;
  const dlbl = labelSprite('Кабинет 6', '#9fd0ff'); dlbl.position.set(15 * S - 0.2, 2.9, wp(5)); g.add(dlbl);
  placeRole([1, 8, -Math.PI / 2], [1, 7, -Math.PI / 2]);

  let phase = 0, busy = false, compot = false, cardGot = false;           // 0 free, 1 challenged, 2 duel over, 3 bell rang
  const duel = { on: false, st: '', t: 0, round: 0, me: 0, him: 0 };
  const REACT = [0.62, 0.5, 0.42];
  function duelNext() { duel.st = 'wait'; duel.t = 1.4 + Math.random() * 2.2; say(`Раунд ${duel.round + 1}. Палец на курке… Жми E, когда будет «ОГОНЬ!»`, 2.5); }
  function duelShot(win, why) {
    duel.st = 'pause'; duel.t = 2.2; audio.shot();
    if (win) duel.me++; else duel.him++;
    duel.round++;
    say(win ? `Хэдшот! Счёт ${duel.me}:${duel.him}` : `${why} Счёт ${duel.me}:${duel.him}`, 2);
    if (duel.me === 2 || duel.him === 2) { duel.on = false; duelEnd(duel.me === 2); }
  }
  function duelEnd(win) {
    life.duel = win ? 'win' : 'lose';
    const my = sid;
    (async () => {
      await wait(2); if (!alive(my)) return;
      if (win) {
        await say('Стендофер: …Ладно. В 1.6 реакция норм. Без читов?', 3.5); if (!alive(my)) return;
        await say('Шестёрки: Он с кем вообще дуэлился? Он один в воздух стрелял…', 4); if (!alive(my)) return;
      } else {
        await say(life.bun ? 'Стендофер: Standoff 2 лучше. Булка моя. С маком, ммм.' : 'Стендофер: Standoff 2 лучше. Даже булки нет, нищеброд.', 3.5); if (!alive(my)) return;
        life.bun = false;
        await say('Ты: В следующий раз дам реванш. С AWP.', 3); if (!alive(my)) return;
      }
      player.frozen = false; phase = 2;
      await wait(1.5); if (!alive(my)) return;
      audio.bell(); phase = 3;
      say('ЗВОНОК! Третий урок, математика. Кабинет 6 — дверь справа.', 3.5);
    })();
  }
  return {
    cells,
    interactables: [
      { x: 12, y: 2.4, r: 1.6, active: () => !compot, label: 'E — взять компот',
        use() { compot = true; audio.pickup(); say('Повариха: Тебе, Коч, двойной. Ты ж у нас именинник… Ой. А откуда я знаю?', 4.5); } },
      { x: 5, y: 2.2, r: 1.5, active: () => !cardGot, label: 'E — поговорить с Дашей',
        use() {
          cardGot = true; life.card = true; audio.pickup(); const my = sid;
          (async () => {
            await say('Даша: Коч! С днём рождения! Это тебе. Только никому.', 3.5); if (!alive(my)) return;
            await say('Открытка: «С ДР, ______!» Имя замазано корректором. Под ним проступают буквы «С…Р…»', 5);
          })();
        } },
      { x: 12.5, y: 6.4, r: 1.6, active: () => phase === 1 && !duel.on, label: 'E — дуэль на реакцию: 1.6 против Standoff',
        use() { duel.on = true; duel.round = duel.me = duel.him = 0; player.frozen = true; faceCell(12.5, 7.5); duelNext(); } },
      { x: 14.5, y: 5.5, r: 1.4, label: () => (phase === 3 ? 'E — на урок' : 'До звонка ещё есть время'),
        use() { if (phase !== 3 || busy) return; busy = true; audio.door(); next(); } },
    ],
    begin(my) {
      audio.hum(true);
      chapter(4, 'Большая перемена');
      (async () => {
        await say(life.late ? 'Ты опоздал на первые уроки. Дежурный пустил только к большой перемене.' : 'Большая перемена. Столовая. Пахнет котлетами и хлоркой.', 4); if (!alive(my)) return;
        await say('В углу — Стендофер со своими шестёрками. Лучше обойти.', 3.5);
      })();
    },
    update(dt) {
      faceToward(stand, player.x * S, player.y * S);
      gang.forEach((m) => faceToward(m, player.x * S, player.y * S));
      faceToward(dasha, player.x * S, player.y * S);
      faceToward(cook, player.x * S, player.y * S);
      if (phase === 0 && net.role !== 'guest' && (player.x > 8 || Math.hypot(player.x - 12.5, player.y - 7.5) < 4)) {
        phase = 0.5; const my = sid;
        (async () => {
          await say('Стендофер: О, кс-ник. Сюда иди.', 2.5); if (!alive(my)) return;
          await say(life.bun ? 'Стендофер: Булка с маком? Гони. Или дуэль: кто быстрее стрельнёт.' : 'Стендофер: Говорят, твоя 1.6 — старьё. Докажи. Дуэль на реакцию.', 4); if (!alive(my)) return;
          phase = 1; say('Подойди к Стендоферу и прими дуэль (E).', 3);
        })();
      }
      if (!duel.on) return;
      const hit = pressed.has('KeyE');
      duel.t -= dt;
      if (duel.st === 'wait') { if (hit) duelShot(false, 'Фальстарт!'); else if (duel.t <= 0) { duel.st = 'fire'; duel.t = REACT[Math.min(duel.round, 2)]; bigMsg('ОГОНЬ!', 600); audio.beep(); } }
      else if (duel.st === 'fire') { if (hit) duelShot(true); else if (duel.t <= 0) duelShot(false, 'Стендофер быстрее!'); }
      else if (duel.st === 'pause' && duel.t <= 0) duelNext();
    },
  };
}

    }
    const title = { chat: 'Мессенджер — Друг', web: 'Браузер', cs: 'Counter-Strike 1.6', bin: 'Корзина' }[st.win];

      `<div class="win"><div class="tt"><span>${title}</span><span>_ □ ✕</span></div><div class="bd">${body}</div></div>` +
      '<div class="bar"><button class="start">пуск</button><span>Коч_ПК</span><button class="up">Встать из-за компа (Esc)</button></div></div>';

    const cb = el.querySelector('[data-cs]'); if (cb) cb.onclick = csRound;

    interactables.push({ x: 7.5, y: 4.5, r: 1.7, active: () => !unlocked, label: 'E — прочитать записку',
      use() { unlocked = true; audio.sting(); say('Записка маминым почерком: «Не корми его. Не отвечай ему. Его нет.»', 5); } });
  } else if (loop === 2) {
    add(g, BOX(2.2, 0.5, 1.2), 0x8a8a90, wp(7), 0.3, wp(4)); add(g, BOX(2.1, 0.2, 1.1), 0xf4f4f4, wp(7), 0.65, wp(4));   // ward bed

    add(g, BOX(0.6, 0.7, 0.6), 0xdedede, wp(5), 0.35, wp(4)); cells[4][5] = 0;
    const pills = add(g, new THREE.CylinderGeometry(0.06, 0.06, 0.16, 10), 0xffffff, wp(5), 0.78, wp(4));
    for (const [t, x, y] of NIGHT_NOTES) { const sp = labelSprite(t, '#c01818'); sp.position.set(wp(x), 1.8, wp(y)); sp.scale.set(2.2, 0.55, 1); g.add(sp); }
    hero = FIG.hero(); hero.position.set(wp(12), 0, wp(2)); g.add(hero);
    interactables.push({ x: 5.5, y: 4.5, r: 1.6, active: () => !unlocked, label: 'E — забрать таблетки',
      use() { unlocked = true; pills.visible = false; flick = 1.5; say('Таблетки друга. На баночке: «Палата 6». Ты прячешь их в карман. Стены перестают дышать.', 4.5); } });
  }
  interactables.push({ x: 12.5, y: 1.6, r: 1.6,
    label: () => (unlocked ? (empty ? 'E — открыть дверь палаты' : 'E — в свою комнату') : ['Дверь не открывается. Где-то звонит телефон…', 'Дверь заперта. На столе записка…', 'Заперто. На тумбочке чьи-то таблетки…'][loop]),
    use() {
      if (guest || !unlocked || busy) return;
      busy = true; audio.door();
      if (loop < L.NIGHT_LOOPS - 1) { story.level = loop + 1; enterState({ color: '#000', ms: 1100 }); } else next({ color: '#ffffff', ms: 1200 });
    } });

  const BEGIN = [
    ['Ты просыпаешься. Ночь. Комп выключен.', 'В доме слишком тихо. Мама? Папа?', 'Где-то звонит телефон.'],
    ['Ты снова в гостиной. Но ты же только что ушёл в свою комнату…', 'Мебель под простынями. Как будто тут давно никто не живёт.', 'Они стоят у стен. Не отворачивайся от них.'],
    ['Снова гостиная. Стены мягкие. Пахнет лекарствами.', 'На стенах кто-то писал. Почерком друга.'],
    ['Дом пустой. Белый. Как будто его никогда не было.', 'Ни мамы. Ни папы. Ни бабки. Ни Барсика.', 'Только дверь.'],
  ][loop];
  const fwd = new THREE.Vector3();
  function scare(s) {
    scareCD = 2.5; audio.caught(); fade(0.85, '#ffffff'); setTimeout(() => fade(0), 160);
    const far = [[1, 1], [13, 1], [13, 7], [6, 7], [1, 4]].sort((a, b) => Math.hypot(b[0] - player.x, b[1] - player.y) - Math.hypot(a[0] - player.x, a[1] - player.y))[0];
    s.x = far[0] + 0.5; s.y = far[1] + 0.5;
    say(NIGHT_WHISPERS[(Math.random() * NIGHT_WHISPERS.length) | 0], 3);
  }
  return {
    cells, interactables,
    begin(my) {
      audio.hum(false); audio.lowpass(loop === 1); audio.danger([0.1, 0.35, 0.25, 0][loop]);
      chapter(9, loop ? `Ночь. Круг ${loop + 1}` : 'Ночь');
      (async () => {
        for (const line of BEGIN) { await say(line, 4); if (!alive(my)) return; }
      })();
    },
    update(dt) {
      torch.position.set(player.x * S, 1.6, player.y * S);
      if (tvTex && Math.random() < 0.5) tvTex.userData.redraw();
      if (ringT >= 0) { ringT -= dt; if (ringT <= 0) { ringT = 2.2; audio.beep(); setTimeout(() => audio.beep(), 180); } }
      if (!empty) {
        stepT -= dt;                                              // footsteps behind you
        if (stepT <= 0) { stepT = 6 + Math.random() * 8; for (let i = 0; i < 3; i++) setTimeout(() => audio.step(), i * 380); }
      }
      if (loop === 1 || loop === 2) {
        whisperT -= dt;
        if (whisperT <= 0) { whisperT = 9 + Math.random() * 6; speak(NIGHT_WHISPERS[(Math.random() * NIGHT_WHISPERS.length) | 0], 0.1); }
      }
      if (loop === 2) {
        camera.fov = 75 + Math.sin(gameTime * 0.9) * (unlocked ? 0.5 : 4); camera.updateProjectionMatrix();     // the walls breathe
        if (lv.lampMat) { const f = flick > 0 ? (Math.random() < 0.5 ? 0.05 : 1) : 0.85; lv.lampMat.color.setRGB(f, f, f); }
        if (flick > 0) flick -= dt;
        if (hero && !heroGone && Math.hypot(player.x - 12.5, player.y - 2.5) < 3.5) {
          heroGone = true; flick = 1.2; audio.sting();
          say('Друг: Коч?.. Ты настоящий? Найди меня. Палата 6.', 3.5);
          setTimeout(() => { if (hero) hero.visible = false; }, 700);
        }
        if (hero && !heroGone) faceToward(hero, player.x * S, player.y * S);
      }
      // loop 1: they only move while you are not looking
      camera.getWorldDirection(fwd);
      scareCD -= dt;
      for (const s of stalkers) {
        const dx = s.x - player.x, dy = s.y - player.y, d = Math.hypot(dx, dy) || 1e-3;
        const seen = (fwd.x * dx + fwd.z * dy) / d > 0.6 && L.canSee(cells, player, s, 16);
        if (!seen) {
          if (d > 1.0) { const p = L.moveWithCollision(cells, s, -dx / d * 1.4 * dt, -dy / d * 1.4 * dt, 0.3); s.x = p.x; s.y = p.y; }
          faceToward(s.m, player.x * S, player.y * S);
        }
        s.m.position.set(s.x * S, 0, s.y * S);
        if (d < 1.2 && scareCD <= 0) scare(s);
      }
    },
  };
}

// =====================================================================
// Movement / interaction / main loop
// =====================================================================
function movePlayer(dt) {
  if (!cur || !cur.cells) return;
  if (keys.ArrowLeft) player.yaw += 1.8 * dt;
  if (keys.ArrowRight) player.yaw -= 1.8 * dt;
  if (pressed.has('ShiftLeft') || pressed.has('ShiftRight')) player.sprint = !player.sprint;   // sprint is a toggle
  if (player.frozen || player.hidden) return;
  let f = 0, r = 0;
  if (keys.KeyW || keys.ArrowUp) f++;
  if (keys.KeyS || keys.ArrowDown) f--;
  if (keys.KeyD) r++;
  if (keys.KeyA) r--;
  f += joy.f; r += joy.r;
  const len = Math.hypot(f, r);
  const inBack = story.state === story.play;
  if (inBack) {
    if (player.tired && player.stamina > 0.3) player.tired = false;
  }
  const wantRun = player.sprint && len > 0 && !player.tired && (!inBack || player.stamina > 0.02);
  if (inBack) {
    player.stamina = Math.max(0, Math.min(1, player.stamina + (wantRun ? -0.25 : 0.15) * dt));
    if (player.stamina <= 0.02 && wantRun) player.tired = true;
    $('stam').firstElementChild.style.background = wantRun ? '#ff9a3c' : '';
    $('stam').firstElementChild.style.width = (player.stamina * 100) + '%';
  }
  if (!len || player.tired) player.sprint = false;     // stop sprinting when you stop or run out of breath
  if (!len) return;
  const inW = !!(cur.inWater && cur.inWater(player.x, player.y));
  const speed = (wantRun ? 3.4 : 2.0) * (inW ? 0.55 : 1);
  const fx = -Math.sin(player.yaw), fy = -Math.cos(player.yaw);
  const rx = Math.cos(player.yaw), ry = -Math.sin(player.yaw);
  const vx = (fx * f + rx * r) / len * speed * dt;
  const vy = (fy * f + ry * r) / len * speed * dt;
  const p = L.moveWithCollision(cur.cells, player, vx, vy, 0.28);
  const moved = Math.hypot(p.x - player.x, p.y - player.y);
  player.x = p.x; player.y = p.y;
  player.bob += moved * 7;
  player.stepDist += moved;
  if (player.stepDist > 0.9) {
    player.stepDist = 0;
    if (inW) { audio.splash(); if (cur.noise) cur.noise(player.x, player.y); } else audio.step();
  }
}

function updateInteract() {
  if (!cur || !cur.interactables || !cur.interactables.length) { setHint(''); return; }
  let best = null, bd = 1e9;
  for (const it of cur.interactables) {
    if (player.hidden && !it.hide) continue;
    if (it.active && !it.active()) continue;
    const d = Math.hypot(player.x - it.x, player.y - it.y);
    if (d < it.r && d < bd) { best = it; bd = d; }
  }
  if (!best) { setHint(''); return; }
  setHint(typeof best.label === 'function' ? best.label() : best.label);
  if (pressed.has('KeyE')) best.use();
}

function syncCamera() {
  if (cur && cur.freeCamera) return;
  const bob = Math.sin(player.bob) * 0.04;
  camera.position.set(player.x * S, player.eye + bob, player.y * S);
  camera.rotation.set(player.pitch, player.yaw, 0);
}

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused && cur) {
    gameTime += dt;
    tickWaits(dt); tickSub(dt);
    movePlayer(dt);
    if (TOUCH) $('tRun').classList.toggle('hot', player.sprint);
    if (cur.update) cur.update(dt);
    updateInteract();
    netTick(dt);
  }
  syncCamera();
  renderer.render(scene, camera);
  pressed.clear();
});

// =====================================================================
// Co-op (PeerJS data channel; host runs the story, guest plays Koch)
// =====================================================================
const CHAT = ['Сюда!', 'Берегись!', 'Нашёл!', 'Помоги!'];
let avatar = null, bubble = null, bubbleT = 0, avPrev = null, chatTimer = 0;
const r3 = (v) => Math.round(v * 1000) / 1000;
const wrapYaw = (a) => Math.atan2(Math.sin(a), Math.cos(a));

function sceneMsg(color) {
  const m = { type: 'scene', state: story.state, level: story.level, seed: seed >>> 0, sid };
  if (color) m.color = color;
  return m;
}
function partnerFig() {
  if (isDlc()) return net.role === 'host' ? FIG.kochfam('Брат Коч') : FIG.koch();
  return net.role === 'host'
    ? FIG.koch()
    : makeFigure({ h: 1.7, body: 0x2f8f4a, label: 'Напарник', labelColor: '#a8ffb8', extra: hair(0x222222) });
}
// what this side calls the other player
const partnerName = () => (isDlc() ? (net.role === 'host' ? 'Брат' : 'Коч') : (net.role === 'host' ? 'Коч' : 'Напарник'));
function removeAvatar() { if (avatar) scene.remove(avatar); avatar = null; bubble = null; avPrev = null; }
function attachAvatar() {
  removeAvatar();
  net.remote.interp = new KochNet.Interp(net.role === 'host' ? 100 : 150);
  net.remote.hidden = false;
  avatar = partnerFig(); avatar.userData.partnerNpc = false; avatar.visible = false;
  scene.add(avatar);
}
function hidePartnerNpcs() { scene.traverse((o) => { if (o.userData && o.userData.partnerNpc) o.visible = false; }); }
function chatLine(who, text) {
  const el = $('chatlog'); el.textContent = `${who}: ${text}`; el.style.display = 'block';
  clearTimeout(chatTimer); chatTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}
function showBubble(text) {
  if (!avatar) return;
  if (bubble) avatar.remove(bubble);
  bubble = labelSprite(text, '#ffffff'); bubble.position.set(0, 2.6, 0); avatar.add(bubble); bubbleT = 3;
}
function buildSnap(now) {
  const en = cur && cur.enemies ? cur.enemies.map((e) => [r3(e.logic.x), r3(e.logic.y), { patrol: 0, chase: 1, search: 2 }[e.logic.state] || 0]) : [];
  const pr = cur && cur.progress;
  return { type: 'snap', t: now, hp: [r3(player.x), r3(player.y), r3(wrapYaw(player.yaw)), r3(player.pitch), player.hidden ? 1 : 0], en, it: pr ? pr.toArray() : [], ex: pr && pr.ready() ? 1 : 0 };
}
function netTick(dt) {
  if (TOUCH) $('tchat').style.display = net.connected ? 'flex' : 'none';
  if (net.role === 'solo' || !net.connected) return;
  const now = performance.now();
  if (!net.busy) {
    if (net.role === 'host' && now - net.snapAt >= 66) { net.snapAt = now; net.send(buildSnap(now)); }
    if (net.role === 'guest' && now - net.posAt >= 50 && cur && cur.cells) {
      net.posAt = now;
      net.send({ type: 'pos', x: r3(player.x), y: r3(player.y), yaw: r3(wrapYaw(player.yaw)), pitch: r3(player.pitch), hid: player.hidden ? 1 : 0 });
    }
  }
  for (let i = 0; i < 4; i++) if (pressed.has('Digit' + (i + 1))) { net.send({ type: 'chat', i }); chatLine('Ты', CHAT[i]); }
  if (!avatar || !net.remote.interp) return;
  const sm = net.remote.interp.sample(now);
  avatar.visible = !!sm && !net.remote.hidden && !(cur && cur.freeCamera);
  if (sm) {
    avatar.position.set(sm.x * S, 0, sm.y * S);
    avatar.rotation.y = sm.yaw + Math.PI;
    const moving = !!avPrev && Math.hypot(sm.x - avPrev.x, sm.y - avPrev.y) > 0.004;
    avPrev = sm;
    animateFigure(avatar, gameTime, moving, false);
  }
  if (bubbleT > 0) { bubbleT -= dt; if (bubbleT <= 0 && bubble) { avatar.remove(bubble); bubble = null; } }
}

function onNetMsg(m) {
  const host = net.role === 'host', guest = net.role === 'guest';
  switch (m.type) {
    case 'bye': if (guest) lostHost(); break;
    case 'hello': {
      if (!guest) break;
      const r = $('joinRole');
      if (r) r.textContent = m.mode === 'dlc' ? 'DLC «Вторая личность»: ты играешь за брата Коча.' : 'Ты играешь за Коча.';
      break;
    }
    case 'pos': {
      if (!host || net.busy || !cur || !cur.cells) break;
      const row = cur.cells[Math.floor(m.y)];
      if (!row || row[Math.floor(m.x)] !== 1) break;       // off-map or inside a wall: ignore
      net.remote.pos = { x: m.x, y: m.y, hidden: m.hid };
      net.remote.hidden = m.hid;
      net.remote.interp && net.remote.interp.push(performance.now(), m);
      break;
    }
    case 'act': if (host && cur && cur.onAct) cur.onAct(m); break;
    case 'chat':
      chatLine(partnerName(), CHAT[m.i]); showBubble(CHAT[m.i]);
      break;
    case 'scene':
      if (!guest || !BUILDERS[m.state]) break;
      { const md = m.state.startsWith('k_') ? 'dlc' : 'main'; if (story.mode !== md) story.reset(md); }
      story.state = m.state; story.level = m.level; seed = m.seed;
      enterState(m.color ? { color: m.color } : {});
      break;
    case 'snap':
      if (!guest || net.busy) break;
      net.snap = m;
      net.remote.hidden = !!m.hp[4];
      net.remote.interp && net.remote.interp.push(performance.now(), { x: m.hp[0], y: m.hp[1], yaw: m.hp[2] });
      break;
    case 'say':
      if (!guest) break;
      say(m.text, m.sec, true);
      if (m.text.startsWith(DARK_TEXT) && cur && cur.netDark) cur.netDark();
      if (cur && cur.netSay) cur.netSay(m.text);
      break;
    case 'caught':
      if (!guest) break;
      if (m.who === 'guest') { if (cur && cur.netCaught) cur.netCaught(); }
      else bigMsg(isDlc() ? 'Коча поймали!' : 'Напарника поймали!', 1800);
      break;
    default: break;
  }
}

function leaveNet() {
  net.gen++;
  const l = net.link; net.link = null;
  if (l) { try { l.send({ type: 'bye' }); } catch (e) { /* closing anyway */ } setTimeout(() => l.close(), 150); }
  net.role = 'solo'; net.connected = false; net.snap = null; net.remote.pos = null; net.remote.interp = null;
  removeAvatar();
}
function lostHost() {
  leaveNet();
  if (!started) { showLobby('Комната занята или закрыта.'); return; }
  paused = true; ended = true;
  document.exitPointerLock && document.exitPointerLock();
  showOverlay('<h1>СВЯЗЬ ПОТЕРЯНА</h1><p>Хост вышел из игры или комната закрыта.</p><b>Кликни — вернуться в меню</b>', () => location.reload());
}
function guestJoined() {
  net.connected = true; net.remote.pos = null;
  net.send({ type: 'hello', proto: 1, mode: story.mode });
  net.send(sceneMsg());
  attachAvatar(); hidePartnerNpcs();

  if (started) bigMsg(`${partnerName()} подключился!`, 2200);
}
function guestLeft() {
  net.connected = false; net.remote.pos = null; removeAvatar();
  const rm = $('roomMsg'); if (rm) rm.textContent = 'Напарник отключился. Ждём нового…';
  if (started) bigMsg(`${partnerName()} отключился. Дальше ты один.`, 3000);
}
function hostRoom(tries = 0) {
  leaveNet();
  if (!window.Peer) { showLobby('Нет PeerJS: для игры вдвоём нужен интернет.'); return; }
  const code = KochNet.makeRoomCode(Math.random);
  net.role = 'host'; net.code = code;
  const my = net.gen;
  showOverlay(
    `<h1>КОМНАТА</h1><p>Код для друга:</p><b class="code" id="roomCode">${code}</b>` +
    '<p id="roomMsg">Создаём комнату…</p><div class="lobby"><button id="bGo">Начать игру</button><button id="bBack">Назад</button></div>'
  );
  $('bGo').onclick = start;
  $('bBack').onclick = () => { leaveNet(); if (isDlc()) showDlcMenu(); else showLobby(); };
  net.link = KochNet.createLink({
    role: 'host', code,
    onReady() { if (my !== net.gen) return; const rm = $('roomMsg'); if (rm) rm.textContent = `Ждём напарника… Друг вводит код и играет за ${isDlc() ? 'брата Коча' : 'Коча'}. Можно начинать сразу.`; },
    onOpen() { if (my === net.gen) guestJoined(); },
    onMsg(m) { if (my === net.gen) onNetMsg(m); },
    onClose() { if (my === net.gen) guestLeft(); },
    onError(e) {
      if (my !== net.gen) return;
      if (e === 'taken' && tries < 5) { hostRoom(tries + 1); return; }
      if (!started) { leaveNet(); showLobby('Ошибка связи: ' + e); } else bigMsg('Ошибка связи: ' + e, 2500);
    },
  });
  if (!net.link) { leaveNet(); showLobby('Нет PeerJS: для игры вдвоём нужен интернет.'); }
}
function joinRoom(raw) {
  const code = KochNet.normalizeCode(raw);
  const msg = (t) => { const e = $('lobbyMsg'); if (e) e.textContent = t; };
  if (!code) { msg('Код — 5 символов (буквы и цифры).'); return; }
  if (!window.Peer) { msg('Нет PeerJS: для игры вдвоём нужен интернет.'); return; }
  leaveNet();
  net.role = 'guest'; net.code = code;
  const my = net.gen;
  msg('Подключаемся…');
  net.link = KochNet.createLink({
    role: 'guest', code,
    onOpen() {
      if (my !== net.gen) return;
      net.connected = true; net.send({ type: 'hello', proto: 1 });
      showOverlay('<h1>ПОДКЛЮЧЕНО</h1><p id="joinRole">Ты играешь за Коча.</p><p>Хост ведёт историю — проходите вместе. ' + (TOUCH ? 'Кнопки внизу' : 'Клавиши 1–4') + ' — быстрый чат.</p><b>Кликни, чтобы начать</b>', start);
    },
    onMsg(m) { if (my === net.gen) onNetMsg(m); },
    onClose() { if (my === net.gen) lostHost(); },
    onError(e) {
      if (my !== net.gen) return;
      leaveNet();
      if (started) { lostHost(); return; }
      showLobby(e === 'notfound' ? 'Комната не найдена. Проверь код.' : 'Ошибка связи: ' + e);
    },
  });
  if (!net.link) { leaveNet(); showLobby('Нет PeerJS: для игры вдвоём нужен интернет.'); }
}

function showDlcMenu() {
  showOverlay(
    '<h1>ВТОРАЯ ЛИЧНОСТЬ</h1>' +
    '<p>DLC, психологический хоррор. Теперь ты — Коч. Один день из его жизни: 12 ноября, ему 14 лет. Только почему никто не помнит про день рождения?</p>' +
    '<p>12 глав: утро, завтрак с семьёй, двор, дуэль в столовой, урок, вечер, комп, сон про детство, ночь, палата №6, коридор и день рождения. Твои решения меняют финал — концовки две.</p>' +
    '<p>Вдвоём: создай комнату — друг вводит код в главном меню и играет за брата Коча.</p>' +
    '<div class="lobby"><button id="bDSolo">Играть одному</button><button id="bDHost">Создать комнату</button><button id="bDBack">Назад</button></div>'
  );
  $('bDSolo').onclick = () => { leaveNet(); setMode('dlc'); start(); };
  $('bDHost').onclick = () => { setMode('dlc'); hostRoom(); };
  $('bDBack').onclick = () => showLobby();
}
// switch between the main story and the DLC before the game starts (rebuilds the first scene)
function setMode(m) {
  if (started || story.mode === m) return;
  story.reset(m);
  sid++;
  cur = BUILDERS[story.state]();
  cur.sid = sid;
}

// =====================================================================
// Boot
// =====================================================================
function start() {
  if (started) return;
  started = true;
  audio.start(); requestLock(); hideOverlay();
  if (TOUCH) {
    try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* optional */ }
    try { const o = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (o && o.catch) o.catch(() => {}); } catch (e) { /* optional */ }
  }
  paused = false;
  if (cur && cur.begin) cur.begin(sid);
}

// debug: ?scene=backrooms (and optional &seed=N) jumps ahead in the story
{
  if (params.get('dlc')) story.reset('dlc');
  const order = isDlc() ? L.DLC_ORDER :['school', 'walk', 'home', 'toilet', 'fall', 'backrooms', 'asylum'];
  const target = params.get('scene');
  const n = target ? Math.max(0, order.indexOf(target)) : 0;
  const lvl = Math.max(0, Math.min(story.levels - 1, Number(params.get('level')) || 0));
  if (isDlc()) { for (let i = 0; i < n; i++) story.advance(); story.level = lvl; }
  else {
    for (let i = 0; i < Math.min(n, 5); i++) story.advance();
    if (params.get('level')) story.level = lvl;
    if (target === 'asylum') { story.level = 2; story.onExit(); }
  }
  sid++;
  cur = BUILDERS[story.state]();
  cur.sid = sid;
}
window.__game = { get paused() { return paused; }, gt: () => gameTime, story, player, get cur() { return cur; }, enterState, camera, scene, L, THREE, net, start, hostRoom, joinRoom, showLobby };

showLobby();
if (params.get('autostart')) start();
</script>
